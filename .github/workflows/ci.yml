name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and regression tests
        run: python3 -m unittest discover -s tests -v

  self-scan:
    name: dogfood soc2_scan on this repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan (fail on high)
        run: python3 skills/soc2-dev/scripts/soc2_scan.py . --format md --fail-on high | tee soc2-scan.md
      - uses: actions/upload-artifact@v4
        with: { name: soc2-scan, path: soc2-scan.md }

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
