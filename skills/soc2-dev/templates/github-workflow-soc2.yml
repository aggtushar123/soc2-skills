# SOC 2 security gates. Make every job here a required status check on the default
# branch (CHG-01, CHG-02). Jobs: secret scan (SEC-01), SCA (SEC-03), SAST (SEC-04),
# container scan (SEC-05), soc2 heuristic scan (EVD-01 drift).
name: soc2-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: secret-scan (SEC-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: dependency-scan (SEC-03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pick the block matching the stack; delete the others.
      - name: npm audit
        if: hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high
      - name: pip-audit
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: pipx run pip-audit -r requirements.txt || pipx run pip-audit .
      - name: govulncheck
        if: hashFiles('go.mod') != ''
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: OWASP dependency-check (Java)
        if: hashFiles('pom.xml', 'build.gradle') != ''
        run: echo "Configure org.owasp:dependency-check-maven or the gradle plugin with failBuildOnCVSS=7"

  sast:
    name: static-analysis (SEC-04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  container-scan:
    name: container-scan (SEC-05)
    if: hashFiles('Dockerfile') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t app:ci .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: app:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

  soc2-scan:
    name: soc2-heuristic-scan (EVD-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scanner
        run: |
          python3 .claude/skills/soc2-dev/scripts/soc2_scan.py . --format md | tee soc2-scan.md
          python3 .claude/skills/soc2-dev/scripts/control_map.py . || true
      - uses: actions/upload-artifact@v4
        with: { name: soc2-scan, path: soc2-scan.md }
